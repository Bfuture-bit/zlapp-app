<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GROK 4.6</title>
<style>
html,body{margin:0;height:100%;background:#030105;overflow:hidden;touch-action:none;cursor:none}
canvas{display:block;width:100%;height:100%}
#veil{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 38%,rgba(2,1,4,.62) 100%)}
#gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 48%,rgba(2,1,4,.42) 0%,rgba(2,1,4,.9) 72%);cursor:pointer;transition:opacity 2.8s ease}
#gate.out{opacity:0;pointer-events:none}
#gate b{font:11px/1 ui-sans-serif,system-ui,sans-serif;font-weight:500;letter-spacing:.72em;color:rgba(255,186,92,.5);text-indent:.72em}
#mark{position:fixed;left:16px;bottom:14px;z-index:5;font:8px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.32em;color:rgba(255,196,118,.14);opacity:0;pointer-events:none;transition:opacity 6s ease}
#mark.on{opacity:1}
</style>
</head>
<body>
<div id="veil"></div>
<div id="gate"><b>ENTER</b></div>
<div id="mark">GROK 4.6</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  'use strict';
  if (typeof THREE === 'undefined') return;

  var mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || innerWidth < 780;
  var COUNT = mobile ? 24000 : 56000;
  var TAU = Math.PI * 2;
  var F0 = 73.416;

  function damp(a, b, l, dt) { return a + (b - a) * (1 - Math.exp(-l * dt)); }
  function dampV(v, x, y, z, l, dt) {
    var k = 1 - Math.exp(-l * dt);
    v.x += (x - v.x) * k; v.y += (y - v.y) * k; v.z += (z - v.z) * k;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function sm(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
  var _s = 0xC0FFEE;
  function rnd() {
    _s = Math.imul(_s ^ _s >>> 16, 0x7feb352d);
    _s = Math.imul(_s ^ _s >>> 15, 0x846ca68b);
    return ((_s ^ _s >>> 16) >>> 0) / 4294967296;
  }
  function hopfJS(eta, phi, psi, sc) {
    var h = eta * 0.5, ce = Math.cos(h), se = Math.sin(h);
    var ap = 0.5 * (psi + phi), am = 0.5 * (psi - phi);
    var x = ce * Math.cos(ap), y = ce * Math.sin(ap);
    var z = se * Math.cos(am), w = se * Math.sin(am);
    var den = Math.max(1 - w, 0.2), k = sc / den;
    return new THREE.Vector3(x * k, y * k, z * k);
  }

  var renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setClearColor(0x030105, 1);
  renderer.autoClear = true;
  renderer.sortObjects = false;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);
  renderer.domElement.style.touchAction = 'none';

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.12, 220);
  camera.position.set(6.6, 1.6, 10.8);

  var uniforms = {
    uTime: { value: 0 },
    uLife: { value: 0.5 },
    uBreathe: { value: 0.5 },
    uExposure: { value: 0.12 },
    uPixelRatio: { value: 1 },
    uPull: { value: new THREE.Vector3() },
    uLenses: { value: [] }
  };
  for (var i = 0; i < 8; i++) uniforms.uLenses.value.push(new THREE.Vector4());

  var vert = [
    'uniform float uTime,uLife,uBreathe,uExposure,uPixelRatio;',
    'uniform vec4 uLenses[8];',
    'uniform vec3 uPull;',
    'attribute float aSeed,aPhase,aEta,aPhi,aPsi,aLane,aFreq,aFamily;',
    'varying vec3 vColor;',
    'varying float vAlpha;',
    'vec3 hopf(float eta,float phi,float psi,float sc){',
    '  float h=eta*0.5;',
    '  float ce=cos(h),se=sin(h);',
    '  float ap=0.5*(psi+phi),am=0.5*(psi-phi);',
    '  float x=ce*cos(ap),y=ce*sin(ap),z=se*cos(am),w=se*sin(am);',
    '  float den=max(1.0-w,0.20);',
    '  return vec3(x,y,z)*(sc/den);',
    '}',
    'void main(){',
    '  float t=uTime;',
    '  float life=uLife;',
    '  float isFil=1.0-step(0.5,aFamily);',
    '  float isSheet=step(0.5,aFamily)*(1.0-step(1.5,aFamily));',
    '  float isAtm=step(1.5,aFamily)*(1.0-step(2.5,aFamily));',
    '  float isSpark=step(2.5,aFamily);',
    '  float eta=aEta+0.11*sin(t*0.29+aPhase)*life+0.055*sin(t*0.71+aSeed*6.28318)*uBreathe;',
    '  float phi=aPhi+t*(0.034+0.018*aFreq);',
    '  float psi=aPsi+t*(0.068+0.10*aLane+0.028*aFreq);',
    '  float sc=mix(7.45,17.8,isAtm);',
    '  sc*=0.93+0.09*life;',
    '  vec3 rest=hopf(eta,phi,mix(psi,psi*0.37,isAtm),sc);',
    '  float cs=cos(t*0.033),sn=sin(t*0.033);',
    '  rest.xz=mat2(cs,-sn,sn,cs)*rest.xz;',
    '  float nod=0.10*sin(t*0.017);',
    '  rest.yz=mat2(cos(nod),-sin(nod),sin(nod),cos(nod))*rest.yz;',
    '  float sh=0.075*sin(t*0.43+aPhase);',
    '  rest.xz=mat2(1.0,sh,-sh,1.0)*rest.xz;',
    '  rest.y+=0.24*sin(rest.x*0.17+t*0.19)*uBreathe;',
    '  vec3 pos=rest;',
    '  float energy=0.11+0.09*life;',
    '  float recAmt=0.0;',
    '  float scar=0.0;',
    '  vec3 acc=vec3(0.0);',
    '  for(int i=0;i<8;i++){',
    '    vec4 L=uLenses[i];',
    '    float s=L.w;',
    '    vec3 d=L.xyz-rest;',
    '    float dist=length(d);',
    '    float dist2=dist*dist+0.40;',
    '    float f=s/dist2;',
    '    acc+=d*f*2.05;',
    '    vec3 dn=d/(dist+0.001);',
    '    acc+=cross(dn,uPull)*f*1.55;',
    '    energy+=s*2.35/dist2;',
    '    scar+=s*smoothstep(6.2,0.7,dist)*0.48;',
    '    float fold=s*smoothstep(4.5,0.11,dist);',
    '    recAmt+=fold;',
    '    vec3 child=hopf(eta*0.82+0.32,phi*1.62,psi*2.18+t*0.22,2.08);',
    '    pos=mix(pos,L.xyz+child,clamp(fold*0.92,0.0,0.90));',
    '  }',
    '  pos+=acc*(0.32+0.22*isFil+0.12*isSpark);',
    '  energy=clamp(energy,0.0,2.4);',
    '  recAmt=clamp(recAmt,0.0,1.0);',
    '  scar=clamp(scar,0.0,1.0);',
    '  vec4 mv=modelViewMatrix*vec4(pos,1.0);',
    '  gl_Position=projectionMatrix*mv;',
    '  float sz=2.15*isFil+1.15*isSheet+8.8*isAtm+1.05*isSpark;',
    '  sz*=1.0+energy*0.22+recAmt*0.7;',
    '  sz*=92.0/max(7.5,-mv.z);',
    '  sz*=uPixelRatio;',
    '  gl_PointSize=clamp(sz,0.7,isAtm>0.5?26.0:14.5);',
    '  vec3 gold=vec3(1.0,0.55,0.15);',
    '  vec3 hot=vec3(1.0,0.93,0.78);',
    '  vec3 cyan=vec3(0.60,0.90,1.0);',
    '  vec3 copper=vec3(0.80,0.28,0.13);',
    '  vec3 wine=vec3(0.30,0.055,0.085);',
    '  float e=clamp(energy*0.52,0.0,1.0);',
    '  vec3 col=mix(gold,hot,smoothstep(0.18,0.88,e));',
    '  col=mix(col,cyan,recAmt);',
    '  col=mix(col,copper,scar*(1.0-recAmt)*0.7);',
    '  col=mix(col,mix(wine,gold,0.22+0.45*e),isAtm);',
    '  col*=uExposure;',
    '  float fog=exp(-0.015*length(mv.xyz));',
    '  col*=fog;',
    '  float alpha=0.58*isFil+0.11*isSheet+0.032*isAtm+0.72*isSpark;',
    '  alpha*=(0.52+0.48*e)*fog*uExposure;',
    '  alpha*=0.72+0.28*life;',
    '  alpha+=recAmt*0.35;',
    '  vColor=col;',
    '  vAlpha=clamp(alpha,0.0,1.0);',
    '}'
  ].join('\n');

  var frag = [
    'varying vec3 vColor;',
    'varying float vAlpha;',
    'void main(){',
    '  vec2 p=gl_PointCoord*2.0-1.0;',
    '  float d=dot(p,p);',
    '  if(d>1.0)discard;',
    '  float core=exp(-d*3.4);',
    '  float halo=exp(-d*1.05)*0.32;',
    '  float a=(core+halo)*vAlpha;',
    '  gl_FragColor=vec4(vColor*(0.5+1.05*core),a);',
    '}'
  ].join('\n');

  var mat = new THREE.ShaderMaterial({
    uniforms: uniforms,
    vertexShader: vert,
    fragmentShader: frag,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true
  });

  var nFil = mobile ? 36 * 96 : 72 * 168;
  var nSpark = mobile ? 1400 : 3200;
  var nAtm = Math.floor(COUNT * (mobile ? 0.22 : 0.18));
  var nSheet = COUNT - nFil - nAtm - nSpark;
  if (nSheet < 800) nSheet = 800;

  var N = nFil + nSheet + nAtm + nSpark;
  var aSeed = new Float32Array(N);
  var aPhase = new Float32Array(N);
  var aEta = new Float32Array(N);
  var aPhi = new Float32Array(N);
  var aPsi = new Float32Array(N);
  var aLane = new Float32Array(N);
  var aFreq = new Float32Array(N);
  var aFamily = new Float32Array(N);
  var dummy = new Float32Array(N * 3);

  var idx = 0;
  var nFiber = mobile ? 36 : 72;
  var nSeg = mobile ? 96 : 168;
  var lanes = [0.52, 0.82, 1.12, 1.57, 1.88, 2.14, 2.38];
  for (var f = 0; f < nFiber; f++) {
    var lane = f % 7;
    var ring = Math.floor(f / 7);
    var nRings = nFiber / 7;
    for (var s = 0; s < nSeg; s++) {
      aFamily[idx] = 0;
      aSeed[idx] = rnd();
      aPhase[idx] = rnd() * TAU;
      aEta[idx] = lanes[lane] + (rnd() - 0.5) * 0.04;
      aPhi[idx] = (ring / nRings) * TAU + (rnd() - 0.5) * 0.08;
      aPsi[idx] = (s / nSeg) * TAU;
      aLane[idx] = lane / 6;
      aFreq[idx] = 0.35 + rnd() * 0.65;
      idx++;
    }
  }
  for (var j = 0; j < nSheet; j++, idx++) {
    aFamily[idx] = 1;
    aSeed[idx] = rnd();
    aPhase[idx] = rnd() * TAU;
    aEta[idx] = 0.42 + rnd() * 2.05;
    aPhi[idx] = rnd() * TAU;
    aPsi[idx] = rnd() * TAU;
    aLane[idx] = rnd();
    aFreq[idx] = rnd();
  }
  for (j = 0; j < nAtm; j++, idx++) {
    aFamily[idx] = 2;
    aSeed[idx] = rnd();
    aPhase[idx] = rnd() * TAU;
    aEta[idx] = 0.28 + rnd() * 2.2;
    aPhi[idx] = rnd() * TAU;
    aPsi[idx] = rnd() * TAU;
    aLane[idx] = rnd();
    aFreq[idx] = 0.2 + rnd() * 0.5;
  }
  for (j = 0; j < nSpark; j++, idx++) {
    aFamily[idx] = 3;
    aSeed[idx] = rnd();
    aPhase[idx] = rnd() * TAU;
    aEta[idx] = 0.7 + rnd() * 1.2;
    aPhi[idx] = rnd() * TAU;
    aPsi[idx] = rnd() * TAU;
    aLane[idx] = rnd();
    aFreq[idx] = 0.5 + rnd();
  }

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(dummy, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(aSeed, 1));
  geo.setAttribute('aPhase', new THREE.BufferAttribute(aPhase, 1));
  geo.setAttribute('aEta', new THREE.BufferAttribute(aEta, 1));
  geo.setAttribute('aPhi', new THREE.BufferAttribute(aPhi, 1));
  geo.setAttribute('aPsi', new THREE.BufferAttribute(aPsi, 1));
  geo.setAttribute('aLane', new THREE.BufferAttribute(aLane, 1));
  geo.setAttribute('aFreq', new THREE.BufferAttribute(aFreq, 1));
  geo.setAttribute('aFamily', new THREE.BufferAttribute(aFamily, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 140);

  var points = new THREE.Points(geo, mat);
  scene.add(points);

  var composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.34, 0.52, 0.48);
  composer.addPass(bloom);

  function resize() {
    var w = innerWidth, h = innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h);
    composer.setPixelRatio(dpr);
    composer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    uniforms.uPixelRatio.value = dpr;
  }
  addEventListener('resize', resize);
  resize();

  var KEYS = [
    { t: 0,  p: [6.6, 1.6, 10.8],  l: [0.0, 0.15, 0.2], fov: 46 },
    { t: 8,  p: [9.4, 2.8, 12.6],   l: [0.0, 0.2, 0.0],  fov: 40 },
    { t: 17, p: [15.2, 6.4, 3.4],   l: [0.0, 0.1, 0.0],  fov: 35 },
    { t: 27, p: [1.2, 0.55, -3.8],  l: [2.4, 0.15, 2.2], fov: 58 },
    { t: 37, p: [-11.5, 8.2, 15.5], l: [0.0, 0.0, 0.0],  fov: 34 },
    { t: 50, p: [3.8, 21.5, 31.0],  l: [0.0, -1.6, 0.0], fov: 30 }
  ];

  function sampleKeys(t) {
    var ks = KEYS;
    if (t <= ks[0].t) return ks[0];
    for (var i = 0; i < ks.length - 1; i++) {
      if (t <= ks[i + 1].t) {
        var u = sm((t - ks[i].t) / (ks[i + 1].t - ks[i].t));
        return {
          p: [lerp(ks[i].p[0], ks[i + 1].p[0], u), lerp(ks[i].p[1], ks[i + 1].p[1], u), lerp(ks[i].p[2], ks[i + 1].p[2], u)],
          l: [lerp(ks[i].l[0], ks[i + 1].l[0], u), lerp(ks[i].l[1], ks[i + 1].l[1], u), lerp(ks[i].l[2], ks[i + 1].l[2], u)],
          fov: lerp(ks[i].fov, ks[i + 1].fov, u)
        };
      }
    }
    return ks[ks.length - 1];
  }

  function cameraGoal(t) {
    var a = t * 0.051;
    var r = 23.2 + 5.4 * Math.sin(t * 0.041);
    var y = 8.4 + 5.1 * Math.sin(t * 0.027) + 1.8 * Math.sin(t * 0.013);
    var live = {
      p: [Math.cos(a) * r, y, Math.sin(a) * r],
      l: [Math.sin(t * 0.021) * 1.7, Math.sin(t * 0.017) * 1.15, Math.cos(t * 0.019) * 1.3],
      fov: 33 + 2.4 * Math.sin(t * 0.03)
    };
    if (t < 50) return sampleKeys(t);
    var u = sm(Math.min(1, (t - 50) / 18));
    var k = sampleKeys(50);
    return {
      p: [lerp(k.p[0], live.p[0], u), lerp(k.p[1], live.p[1], u), lerp(k.p[2], live.p[2], u)],
      l: [lerp(k.l[0], live.l[0], u), lerp(k.l[1], live.l[1], u), lerp(k.l[2], live.l[2], u)],
      fov: lerp(k.fov, live.fov, u)
    };
  }

  var camP = new THREE.Vector3(6.6, 1.6, 10.8);
  var camL = new THREE.Vector3(0.0, 0.15, 0.2);
  var camFov = 46;
  var look = new THREE.Vector3();

  var wells = [];
  var held = null;
  var lastWell = null;
  var pull = new THREE.Vector3();
  var pullT = new THREE.Vector3();
  var raycaster = new THREE.Raycaster();
  var hitT = new THREE.Vector3();
  var sphere = new THREE.Sphere(new THREE.Vector3(), 11.2);
  var thought = [0, 0, 0];
  var energySmoothed = 0;

  function hitWorld(cx, cy) {
    var ndc = new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    if (!raycaster.ray.intersectSphere(sphere, hitT)) {
      raycaster.ray.closestPointToPoint(sphere.center, hitT);
      if (hitT.lengthSq() < 1e-6) {
        camera.getWorldDirection(hitT);
        hitT.multiplyScalar(-11.2);
      } else {
        hitT.setLength(11.2);
      }
    }
    return hitT;
  }

  var audio = null;

  function makeIR(ctx) {
    var dur = 6.4, sr = ctx.sampleRate, n = (dur * sr) | 0;
    var buf = ctx.createBuffer(2, n, sr);
    for (var ch = 0; ch < 2; ch++) {
      var d = buf.getChannelData(ch), lp = 0, lp2 = 0;
      for (var i = 0; i < n; i++) {
        var tt = i / sr;
        var env = Math.exp(-tt * 1.42) * Math.pow(Math.max(0, 1 - tt / dur), 0.55);
        var hf = Math.exp(-tt * 3.9);
        var w = Math.random() * 2 - 1;
        lp += 0.13 * (w - lp);
        lp2 += 0.045 * (lp - lp2);
        d[i] = (lp2 * (1 - hf * 0.48) + w * hf * 0.32) * env * 0.48;
      }
      var early = ch ? [0.022, 0.051, 0.088, 0.134, 0.181, 0.246] : [0.017, 0.043, 0.079, 0.119, 0.164, 0.223];
      for (var k = 0; k < early.length; k++) {
        var ii = (early[k] * sr) | 0;
        if (ii < n) d[ii] += (k & 1 ? 0.26 : -0.26) * Math.exp(-k * 0.34);
      }
    }
    return buf;
  }

  function buildAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    var master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);

    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 52;
    var lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1520;
    lp.Q.value = 0.62;
    var bus = ctx.createGain();
    bus.gain.value = 1;
    bus.connect(hp);
    hp.connect(lp);

    var dry = ctx.createGain();
    dry.gain.value = 0.58;
    lp.connect(dry);
    dry.connect(master);

    var conv = ctx.createConvolver();
    conv.buffer = makeIR(ctx);
    var cg = ctx.createGain();
    cg.gain.value = 0.48;
    lp.connect(conv);
    conv.connect(cg);
    cg.connect(master);

    var dL = ctx.createDelay(3);
    dL.delayTime.value = 0.46;
    var dR = ctx.createDelay(3);
    dR.delayTime.value = 1.14;
    var dg = ctx.createGain();
    dg.gain.value = 0.16;
    var mer = ctx.createChannelMerger(2);
    lp.connect(dL); lp.connect(dR);
    dL.connect(dg); dR.connect(dg);
    dg.connect(mer, 0, 0);
    dg.connect(mer, 0, 1);
    mer.connect(master);

    var deep = ctx.createDelay(5);
    deep.delayTime.value = 2.82;
    var deepLp = ctx.createBiquadFilter();
    deepLp.type = 'lowpass';
    deepLp.frequency.value = 780;
    var deepG = ctx.createGain();
    deepG.gain.value = 0.04;
    lp.connect(deep);
    deep.connect(deepLp);
    deepLp.connect(deepG);
    var foldPan = ctx.createStereoPanner();
    foldPan.pan.value = 0;
    deepG.connect(foldPan);
    foldPan.connect(master);

    var PART = [[1, 1], [2, 0.145], [3, 0.068], [5, 0.022], [7, 0.01]];
    var pitches = [F0, F0 * 1.5, F0 * 2, F0 * 2.5, F0 * 3.5];
    var amps = [0.068, 0.048, 0.03, 0.011, 0.0055];
    var voices = [];

    function addVoice(freq, amp, panV, det) {
      var panner = ctx.createStereoPanner();
      panner.pan.value = panV;
      panner.connect(bus);
      var g = ctx.createGain();
      g.gain.value = amp;
      g.connect(panner);
      var oscs = [];
      for (var i = 0; i < PART.length; i++) {
        var o = ctx.createOscillator();
        o.type = 'sine';
        o.frequency.value = freq * PART[i][0];
        o.detune.value = det;
        var og = ctx.createGain();
        og.gain.value = PART[i][1];
        o.connect(og);
        og.connect(g);
        o.start();
        oscs.push(o);
      }
      return { g: g, oscs: oscs };
    }

    for (var v = 0; v < pitches.length; v++) {
      voices.push(addVoice(pitches[v], amps[v], -0.62, -3.2));
      voices.push(addVoice(pitches[v], amps[v], 0.62, 3.2));
    }

    function lfo(freq, depth, param) {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;
      var g = ctx.createGain();
      g.gain.value = depth;
      o.connect(g);
      g.connect(param);
      o.start();
    }
    lfo(0.053, 0.012, voices[0].g.gain);
    lfo(0.031, 0.01, voices[2].g.gain);
    lfo(0.079, 0.011, voices[4].g.gain);
    lfo(0.017, 0.006, voices[6].g.gain);
    lfo(0.041, 0.004, voices[8].g.gain);

    var nlen = ctx.sampleRate * 2;
    var nb = ctx.createBuffer(1, nlen, ctx.sampleRate);
    var nd = nb.getChannelData(0), pk = 0;
    for (var n = 0; n < nlen; n++) {
      pk = 0.97 * pk + 0.03 * (Math.random() * 2 - 1);
      nd[n] = pk;
    }
    var ns = ctx.createBufferSource();
    ns.buffer = nb;
    ns.loop = true;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 510;
    bp.Q.value = 1.55;
    var ng = ctx.createGain();
    ng.gain.value = 0.022;
    ns.connect(bp);
    bp.connect(ng);
    ng.connect(bus);
    ns.start();
    lfo(0.023, 0.008, ng.gain);

    master.gain.linearRampToValueAtTime(0.205, ctx.currentTime + 10.5);

    return {
      ctx: ctx, master: master, lp: lp, deepG: deepG, dg: dg, foldPan: foldPan,
      voices: voices, bus: bus, ng: ng
    };
  }

  function bloomPartial(strength, panV) {
    if (!audio) return;
    var ctx = audio.ctx, t = ctx.currentTime;
    var f0 = F0 * 2.25;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.042 * strength, t + 0.48);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 4.4);
    var p = ctx.createStereoPanner();
    p.pan.value = panV;
    g.connect(p);
    p.connect(audio.bus);
    var gs = [1, 0.13, 0.045];
    for (var i = 0; i < 3; i++) {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f0 * (i + 1);
      var og = ctx.createGain();
      og.gain.value = gs[i];
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + 4.6);
    }
  }

  function onFoldSound(ndcX, strength) {
    if (!audio) return;
    var ctx = audio.ctx, t = ctx.currentTime;
    var panV = Math.max(-0.85, Math.min(0.85, ndcX));
    audio.foldPan.pan.setTargetAtTime(panV, t, 0.14);
    audio.lp.frequency.setTargetAtTime(2680, t, 0.09);
    audio.lp.frequency.setTargetAtTime(1580, t + 2.1, 1.6);
    audio.deepG.gain.setTargetAtTime(0.2 * strength, t, 0.18);
    audio.deepG.gain.setTargetAtTime(0.055, t + 4.2, 2.1);
    for (var vi = 6; vi <= 9; vi++) {
      var amp = vi < 8 ? 0.05 * strength : 0.034 * strength;
      var rest = vi < 8 ? 0.016 : 0.008;
      audio.voices[vi].g.gain.setTargetAtTime(amp, t, 0.1);
      audio.voices[vi].g.gain.setTargetAtTime(rest, t + 3.0, 1.8);
    }
    bloomPartial(strength, panV);
  }

  function imprint(cx, cy, isNew) {
    var hit = hitWorld(cx, cy).clone();
    var best = null, bestD = 2.85;
    for (var i = 0; i < wells.length; i++) {
      var d = wells[i].pos.distanceTo(hit);
      if (d < bestD) { bestD = d; best = wells[i]; }
    }
    if (best) {
      if (isNew) {
        best.held = true;
        best.s = Math.max(best.s, 1.05);
        best.fold = Math.max(best.fold, 0.45);
        best.residual = Math.min(0.4, best.residual + 0.08);
        onFoldSound((cx / innerWidth) * 2 - 1, 0.85 + best.residual);
      } else {
        pullT.subVectors(hit, best.pos);
        best.pos.lerp(hit, 0.14);
      }
      held = best;
      lastWell = best;
      return;
    }
    if (!isNew) {
      if (held) held.pos.lerp(hit, 0.1);
      return;
    }
    if (wells.length >= 5) {
      var weak = 0;
      for (i = 1; i < wells.length; i++) if (wells[i].residual < wells[weak].residual && !wells[i].held) weak = i;
      wells.splice(weak, 1);
    }
    var w = { pos: hit, s: 1.15, fold: 0.55, residual: 0.26, age: 0, held: true };
    wells.push(w);
    held = w;
    lastWell = w;
    onFoldSound((cx / innerWidth) * 2 - 1, 1);
  }

  var started = false;
  var chapterT = 0;
  var clock0 = performance.now();
  var last = clock0;
  var ptr = { x: innerWidth * 0.5, y: innerHeight * 0.5, down: false };

  function start() {
    if (started) return;
    started = true;
    document.getElementById('gate').classList.add('out');
    document.getElementById('mark').classList.add('on');
    setTimeout(function () { document.getElementById('gate').style.display = 'none'; }, 2900);
    try {
      audio = buildAudio();
      if (audio.ctx.state === 'suspended') audio.ctx.resume();
    } catch (e) { audio = null; }
    chapterT = 0;
  }

  document.getElementById('gate').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    start();
  });
  addEventListener('keydown', function (e) {
    if (!started && (e.key === 'Enter' || e.key === ' ')) start();
  });

  function onPtrDown(e) {
    if (!started) return;
    e.preventDefault();
    ptr.down = true;
    ptr.x = e.clientX;
    ptr.y = e.clientY;
    imprint(ptr.x, ptr.y, true);
  }
  function onPtrMove(e) {
    ptr.x = e.clientX;
    ptr.y = e.clientY;
    if (started && ptr.down) imprint(ptr.x, ptr.y, false);
  }
  function onPtrUp() {
    ptr.down = false;
    if (held) held.held = false;
    held = null;
    pullT.multiplyScalar(0.35);
  }

  renderer.domElement.addEventListener('pointerdown', onPtrDown);
  addEventListener('pointermove', onPtrMove, { passive: true });
  addEventListener('pointerup', onPtrUp);
  addEventListener('pointercancel', onPtrUp);
  addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function tick(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var tAbs = (now - clock0) / 1000;
    if (started) chapterT += dt;

    var t = started ? chapterT : tAbs * 0.35;
    var ph1 = 0.41, ph2 = 1.7, ph3 = 3.9;
    var life = 0.50
      + 0.16 * Math.sin(0.29 * t + ph1)
      + 0.10 * Math.sin(0.43 * t - ph2)
      + 0.06 * Math.sin(0.71 * t + ph3);
    var breathe = 0.5 + 0.5 * Math.sin(0.19 * t + 0.6);

    uniforms.uTime.value = t;
    uniforms.uLife.value = life;
    uniforms.uBreathe.value = breathe;
    uniforms.uExposure.value = damp(uniforms.uExposure.value, started ? 1 : 0.13, started ? 1.1 : 0.4, dt);

    if (Math.random() < dt * 0.075) {
      var ti = (Math.random() * 3) | 0;
      thought[ti] = 1;
      if (audio && started) {
        var vv = audio.voices[6];
        vv.g.gain.setTargetAtTime(0.028, audio.ctx.currentTime, 0.2);
        vv.g.gain.setTargetAtTime(0.012, audio.ctx.currentTime + 1.8, 1.2);
      }
    }
    for (var th = 0; th < 3; th++) thought[th] = damp(thought[th], 0, 1.15, dt);

    var rot = t * 0.033;
    var cr = Math.cos(rot), sr = Math.sin(rot);
    var lenses = uniforms.uLenses.value;
    for (var i = 0; i < 8; i++) lenses[i].set(0, 0, 0, 0);

    for (i = 0; i < 3; i++) {
      var eta = 0.88 + i * 0.34;
      var phi = t * (0.07 + i * 0.018) + i * 2.094;
      var psi = t * 0.21 + i * 1.2;
      var hp = hopfJS(eta, phi, psi, 7.5);
      var px = hp.x * cr - hp.z * sr;
      var pz = hp.x * sr + hp.z * cr;
      var str = 0.32 + 0.18 * Math.sin(t * 0.23 + i * 2.1) + thought[i] * 0.85;
      lenses[i].set(px, hp.y, pz, str);
    }
    for (i = 0; i < wells.length; i++) {
      var w = wells[i];
      w.age += dt;
      if (w.held) {
        w.fold = damp(w.fold, 1, 2.1, dt);
        w.s = damp(w.s, 0.55 + w.fold * 1.25, 3.2, dt);
      } else {
        w.fold = damp(w.fold, 0, 0.55, dt);
        w.s = damp(w.s, w.residual, 0.7, dt);
        w.residual = damp(w.residual, 0.16, 0.015, dt);
      }
      lenses[3 + i].set(w.pos.x, w.pos.y, w.pos.z, w.s);
    }

    pull.x = damp(pull.x, pullT.x, 2.4, dt);
    pull.y = damp(pull.y, pullT.y, 2.4, dt);
    pull.z = damp(pull.z, pullT.z, 2.4, dt);
    pullT.multiplyScalar(Math.exp(-1.8 * dt));
    uniforms.uPull.value.copy(pull);

    var eNow = 0;
    for (i = 0; i < 8; i++) eNow += lenses[i].w;
    energySmoothed = damp(energySmoothed, eNow, 1.6, dt);

    if (audio && started) {
      var ct = audio.ctx.currentTime;
      audio.lp.frequency.setTargetAtTime(1380 + life * 420 + energySmoothed * 220, ct, 0.35);
      audio.dg.gain.setTargetAtTime(0.12 + life * 0.07 + energySmoothed * 0.03, ct, 0.4);
      audio.ng.gain.setTargetAtTime(0.016 + 0.012 * breathe, ct, 0.5);
    }

    bloom.strength = 0.30 + 0.08 * life + Math.min(0.16, energySmoothed * 0.06);
    bloom.threshold = 0.50 - Math.min(0.06, energySmoothed * 0.02);

    var goal = cameraGoal(started ? chapterT : 0);
    if (lastWell) {
      goal.l[0] += lastWell.pos.x * 0.1;
      goal.l[1] += lastWell.pos.y * 0.1;
      goal.l[2] += lastWell.pos.z * 0.1;
    }
    var lam = started ? (chapterT > 50 ? 0.72 : (chapterT > 24 && chapterT < 32 ? 1.85 : 1.28)) : 0.45;
    dampV(camP, goal.p[0], goal.p[1], goal.p[2], lam, dt);
    dampV(camL, goal.l[0], goal.l[1], goal.l[2], lam * 0.85, dt);
    camFov = damp(camFov, goal.fov, 1.1, dt);
    camera.position.copy(camP);
    look.copy(camL);
    camera.lookAt(look);
    if (Math.abs(camera.fov - camFov) > 0.01) {
      camera.fov = camFov;
      camera.updateProjectionMatrix();
    }

    composer.render(dt);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
