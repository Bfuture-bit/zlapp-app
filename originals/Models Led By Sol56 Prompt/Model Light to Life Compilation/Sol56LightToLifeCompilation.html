const muse=new THREE.Points(mG,mMat);world.add(muse);

// ---------- QWEN: woven witness plane; touch propagates and becomes memory ----------
const QX=mobile?86:126,QZ=mobile?58:82,QN=QX*QZ,qPos=new Float32Array(QN*3),qX=new Float32Array(QN),qZ=new Float32Array(QN);for(let iz=0,i=0;iz<QZ;iz++)for(let ix=0;ix<QX;ix++,i++){qX[i]=mix(-18,18,ix/(QX-1));qZ[i]=mix(-15,12,iz/(QZ-1));}
function mix(a,b,t){return a+(b-a)*t}
const qG=new THREE.BufferGeometry();qG.setAttribute('position',new THREE.BufferAttribute(qPos,3));qG.setAttribute('aX',new THREE.BufferAttribute(qX,1));qG.setAttribute('aZ',new THREE.BufferAttribute(qZ,1));
const qMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0},uReveal:{value:0},uPX:{value:renderer.getPixelRatio()},uEv:{value:evPos},uAge:{value:evAge},uPow:{value:evPower}},vertexShader:`
attribute float aX,aZ;uniform float uTime,uReveal,uPX;uniform vec3 uEv[${MAXEV}];uniform float uAge[${MAXEV}],uPow[${MAXEV}];varying float vE,vM,vW;void main(){vec2 p=vec2(aX,aZ);float h=sin(aX*.33+uTime*.24+sin(aZ*.19-uTime*.12))* .18+sin(aZ*.39-uTime*.16)*.11;float e=0.,m=0.;for(int i=0;i<${MAXEV};i++){if(uAge[i]<18.){vec2 ep=uEv[i].xz;float age=uAge[i];float d=distance(p,ep);float ring=exp(-pow(d-(.7+age*2.5),2.)*.8)*exp(-age*.35)*uPow[i];float mem=exp(-d*d*.05)*exp(-age*.045)*uPow[i];h+=ring*.72+mem*.14;e+=ring;m+=mem;}}vec3 pos=vec3(aX,h-5.7,aZ);vec4 mv=modelViewMatrix*vec4(pos,1);gl_Position=projectionMatrix*mv;gl_PointSize=uPX*(1.15+e*.75+m*.24)*(300./max(5.,-mv.z));vE=e;vM=m;vW=.5+.5*sin((aX+aZ)*.55);}` ,fragmentShader:`
varying float vE,vM,vW;uniform float uReveal;void main(){vec2 q=gl_PointCoord-.5;float d=length(q);if(d>.5)discard;float a=smoothstep(.5,.04,d);vec3 teal=mix(vec3(.025,.16,.20),vec3(.11,.52,.55),vW);vec3 witness=vec3(.92,.73,.36);vec3 c=mix(teal,witness,clamp(vM*.46+vE*.25,0.,.65));gl_FragColor=vec4(c,a*(.025+.04*vE+.028*vM)*uReveal);}`});
const qwen=new THREE.Points(qG,qMat);world.add(qwen);
const horizonG=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-20,-5.65,-15.2),new THREE.Vector3(20,-5.65,-15.2)]);const horizon=new THREE.Line(horizonG,new THREE.LineBasicMaterial({color:0x6fd6d5,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false}));world.add(horizon);

// Atmosphere shared by every identity.
const STAR=mobile?1800:3800,sp=new Float32Array(STAR*3);for(let i=0;i<STAR;i++){let r=25+Math.pow(Math.random(),.35)*75,th=Math.random()*TAU,ph=Math.acos(2*Math.random()-1);sp[i*3]=r*Math.sin(ph)*Math.cos(th);sp[i*3+1]=r*Math.cos(ph);sp[i*3+2]=r*Math.sin(ph)*Math.sin(th)}const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));const sm=new THREE.PointsMaterial({color:0x8eb5bd,size:.055,transparent:true,opacity:.19,depthWrite:false,blending:THREE.AdditiveBlending});scene.add(new THREE.Points(sg,sm));

// ---------------- ONE ORCHESTRA ----------------
let AC=null,master=null,orchBus=null,wetBus=null,conv=null,airGain=null,muted=false,currentChord=-1,lastChordAt=-99,lastEventSound=-99,stringBanks=[];
const CHORDS=[
  [65.406,98.000,130.813,164.814,195.998,246.942,293.665], // Cmaj9
  [65.406,110.000,130.813,164.814,195.998,246.942,261.626], // Am9/C
  [65.406,87.307,130.813,174.614,220.000,261.626,369.994], // Fmaj9(#11)/C
  [73.416,97.999,146.832,195.998,220.000,246.942,329.628]  // G6/add9/D
];
function makeIR(ctx,dur=7.5){const n=Math.floor(ctx.sampleRate*dur),b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){const t=i/ctx.sampleRate,env=Math.exp(-t*.82)*Math.pow(1-i/n,.38),w=Math.random()*2-1,a=.08+.45*(1-Math.exp(-t*.7));lp+=a*(w-lp);d[i]=lp*env*.56;}}return b}
function makeStringWave(ctx){const N=16,re=new Float32Array(N),im=new Float32Array(N);for(let n=1;n<N;n++){re[n]=1/Math.pow(n,1.35)*(n%2?1:.72)}return ctx.createPeriodicWave(re,im,{disableNormalization:false})}
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.0001;const comp=AC.createDynamicsCompressor();comp.threshold.value=-21;comp.knee.value=24;comp.ratio.value=2.1;comp.attack.value=.025;comp.release.value=.55;master.connect(comp).connect(AC.destination);orchBus=AC.createGain();orchBus.gain.value=.74;const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=42;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3100;lp.Q.value=.35;orchBus.connect(hp).connect(lp);const dry=AC.createGain();dry.gain.value=.7;lp.connect(dry).connect(master);conv=AC.createConvolver();conv.buffer=makeIR(AC);wetBus=AC.createGain();wetBus.gain.value=.48;lp.connect(conv).connect(wetBus).connect(master);
  // low moving air, almost below awareness
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);let br=0;for(let i=0;i<nd.length;i++){br=(br+(Math.random()*2-1)*.03)/1.03;nd[i]=br}const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=540;nf.Q.value=.14;airGain=AC.createGain();airGain.gain.value=.0055;ns.connect(nf).connect(airGain).connect(orchBus);ns.start();
  const t=AC.currentTime;master.gain.setValueAtTime(.0001,t);master.gain.exponentialRampToValueAtTime(mobile?.36:.42,t+6.5); startChord(0,true);
}
function createStringBank(freqs,fadeIn=5){const t=AC.currentTime,wave=makeStringWave(AC),bank=AC.createGain();bank.gain.value=.0001;const filt=AC.createBiquadFilter();filt.type='lowpass';filt.frequency.value=1350;filt.Q.value=.25;bank.connect(filt).connect(orchBus);
  freqs.forEach((f,i)=>{const pan=AC.createStereoPanner();pan.pan.value=clamp((i-(freqs.length-1)/2)*.18,-.72,.72);const vg=AC.createGain();vg.gain.value=.0175*(i<2?1.12:1)*(1-i*.04);vg.connect(pan).connect(bank);
    // bowed-string body: paired, very slightly detuned periodic waves
    for(const det of [-3.4,3.1]){const o=AC.createOscillator();o.setPeriodicWave(wave);o.frequency.value=f;o.detune.value=det;const og=AC.createGain();og.gain.value=.5;o.connect(og).connect(vg);o.start();}
    // pad halo: quiet sine fundamentals + octave, long and almost motionless
    const halo=AC.createGain();halo.gain.value=.22;halo.connect(pan);for(const [r,a] of [[1,1],[2,.19],[3,.045]]){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*r;o.detune.value=(Math.random()-.5)*1.1;g.gain.value=a;o.connect(g).connect(halo);o.start();}
  });
  const now=AC.currentTime;bank.gain.setValueAtTime(.0001,now);bank.gain.exponentialRampToValueAtTime(1,now+fadeIn);return {bank,filt,born:now}}
function startChord(idx,first=false){if(!AC)return;currentChord=idx%CHORDS.length;const b=createStringBank(CHORDS[currentChord],first?6.5:5.2);stringBanks.push(b);const now=AC.currentTime;for(const old of stringBanks.slice(0,-1)){old.bank.gain.cancelScheduledValues(now);old.bank.gain.setValueAtTime(Math.max(.0001,old.bank.gain.value),now);old.bank.gain.exponentialRampToValueAtTime(.0001,now+6.2);setTimeout(()=>{try{old.bank.disconnect()}catch{}},7000)}if(stringBanks.length>3)stringBanks.splice(0,stringBanks.length-3);lastChordAt=simT}
function partialVoice(freq,pan,level,attack,dur,bright=1800,ratios=[1,2.002,3.004,5.01]){if(!AC||muted)return;const t=AC.currentTime,g=AC.createGain(),f=AC.createBiquadFilter(),p=AC.createStereoPanner();p.pan.value=clamp(pan,-.82,.82);f.type='lowpass';f.frequency.setValueAtTime(Math.max(500,bright*.55),t);f.frequency.exponentialRampToValueAtTime(bright,t+Math.max(.15,attack));f.frequency.exponentialRampToValueAtTime(Math.max(600,bright*.48),t+dur*.78);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);g.connect(f).connect(p);p.connect(orchBus);p.connect(conv);const gs=[1,.14,.045,.012];ratios.forEach((r,i)=>{const o=AC.createOscillator(),og=AC.createGain();o.type='sine';o.frequency.value=freq*r;o.detune.value=(i%2?1:-1)*.7*i;og.gain.value=gs[i]||.01;o.connect(og).connect(g);o.start(t);o.stop(t+dur+.1)});}
function harp(freq,pan,level=.045){if(!AC||muted)return;const t=AC.currentTime,g=AC.createGain(),f=AC.createBiquadFilter(),p=AC.createStereoPanner();p.pan.value=pan;f.type='lowpass';f.frequency.value=3600;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+3.8);g.connect(f).connect(p);p.connect(orchBus);p.connect(conv);[1,2,3,4.02].forEach((r,i)=>{const o=AC.createOscillator(),og=AC.createGain();o.type=i? 'sine':'triangle';o.frequency.value=freq*r;og.gain.value=[1,.22,.08,.025][i];o.connect(og).connect(g);o.start(t);o.stop(t+4)})}
function soundGesture(xNorm,power,kind){if(!AC||muted||simT-lastEventSound<.16)return;lastEventSound=simT;const pan=clamp(xNorm*.7,-.7,.7);const notes=[130.813,146.832,164.814,195.998,220,246.942,293.665,329.628];const f=notes[Math.floor(clamp((xNorm+1)*.5,0,.999)*notes.length)];if(kind==='sol'){partialVoice(f*.5,pan,.036*power,.42,6.8,2200);partialVoice(f*.75,-pan*.25,.022*power,.72,7.2,1800,[1,2.002,3.0]);}
else if(kind==='glm'){harp(f,pan,.037*power);partialVoice(f*.5,pan*.4,.018*power,.7,5.2,1450);}
else if(kind==='grokx'){partialVoice(f*.5,pan,.04*power,.95,7.8,1750);partialVoice(f*.75,-pan*.18,.018*power,1.15,8.2,1400);}
else if(kind==='grok'){partialVoice(f*.375,pan,.038*power,.6,6.5,1250);harp(f*.75,-pan*.35,.022*power);}
else if(kind==='muse'){partialVoice(f*.5,pan,.026*power,.34,5.8,1650);harp(f*1.5,-pan*.2,.018*power);}
else {harp(f*1.5,pan,.03*power);partialVoice(f*.75,-pan*.22,.015*power,.65,5.5,1900);}}

function nearestKnotTheta(worldP){let best=0,bd=1e9;for(let i=0;i<100;i++){const t=i/100*TAU,cq=Math.cos(3*t),sq=Math.sin(3*t),cp=Math.cos(5*t),sp=Math.sin(5*t),p=new THREE.Vector3((6.2+2.25*cq)*cp,(6.2+2.25*cq)*sp,2.25*sq*1.14).multiplyScalar(.9*.76);p.y+=.9;const d=p.distanceToSquared(worldP);if(d<bd){bd=d;best=t}}return best}
function rayPlane(clientX,clientY,y=0){ndc.set(clientX/innerWidth*2-1,-clientY/innerHeight*2+1);raycaster.setFromCamera(ndc,camera);const plane=new THREE.Plane(new THREE.Vector3(0,1,0),-y),p=new THREE.Vector3();return raycaster.ray.intersectPlane(plane,p)||raycaster.ray.at(16,p)}
function raySphere(clientX,clientY,r=8){ndc.set(clientX/innerWidth*2-1,-clientY/innerHeight*2+1);raycaster.setFromCamera(ndc,camera);const p=new THREE.Vector3();return raycaster.ray.intersectSphere(new THREE.Sphere(new THREE.Vector3(0,1,0),r),p)||raycaster.ray.at(16,p)}
function wakeAudio(){if(!AC)initAudio();if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
function interact(cx,cy,power=1,forceKind=null){if(!entered)return;wakeAudio();lastInput=simT;const wp=raySphere(cx,cy,8.5);const visualPower=Math.min(.16,power*.15);addSharedEvent(wp,visualPower); // intentionally subtle: interaction should enrich the world, never become the visual subject
 const idx=(evCursor-1+MAXEV)%MAXEV; solMat.uniforms.uQuestionX.value[idx]=clamp(wp.x/16,-1,1); solMat.uniforms.uQuestionY.value[idx]=clamp((wp.y-1.1)/3,-1,1); solMat.uniforms.uQuestionAge.value[idx]=0; solMat.uniforms.uQuestionPower.value[idx]=visualPower;
 // Grok-X fold
 let fs=0;for(let i=1;i<MAXF;i++)if(foldStr[i]<foldStr[fs])fs=i;foldTheta[fs]=nearestKnotTheta(wp);foldStr[fs]=Math.min(.34,.16+visualPower*.45);foldAge[fs]=0;
 // Grok well
 const wi=wellCursor++%MAXW;wells[wi].set(wp.x,wp.y,wp.z,.10+visualPower*.22);wellAge[wi]=0;
 // Muse chooses a filament and may refuse rough treatment
 const fi=Math.floor(clamp(cx/innerWidth,0,.999)*MF),rough=pSpeed>.028||power>1.05,rapid=simT-lastTouch[fi]<.85;touches[fi]++;let refused=false;if(trust[fi]<.48&&(rough||rapid)&&Math.random()<clamp((.52-trust[fi])*1.8+(rough?.22:0),0,.78)){refused=true;refusal[fi]=1;trust[fi]=Math.max(.1,trust[fi]-.07)}else{trust[fi]=clamp(trust[fi]+(rough?.012:.045)-(rapid?.025:0),.1,.97);hueMem[fi]=clamp(hueMem[fi]+(touches[fi]%3===0?-.04:.035),-.4,.4)}lastTouch[fi]=simT;
 const phase=(Math.floor(simT/9)+Math.floor(cx/Math.max(1,innerWidth/6)))%6;const kind=forceKind||['sol','glm','grokx','grok','muse','qwen'][phase];soundGesture(cx/innerWidth*2-1,refused?.55:power,refused?'muse':kind);
}

const enter=document.getElementById('enter'),gate=document.getElementById('gate'),mute=document.getElementById('mute'),guide=document.getElementById('guide'),cursor=document.getElementById('cursor'),voiceEls=[...document.querySelectorAll('.voice')];
function start(){if(entered)return;entered=true;gate.classList.add('out');document.body.classList.add('in');wakeAudio();lastInput=simT;setTimeout(()=>guide.style.opacity='.08',12000)}enter.addEventListener('click',start);gate.addEventListener('pointerdown',e=>{if(e.target===enter)return;start()});addEventListener('keydown',e=>{if(!entered&&(e.key==='Enter'||e.key===' '))start();if(entered&&e.key.toLowerCase()==='m')toggleMute()});
function toggleMute(){muted=!muted;mute.textContent=muted?'SOUND OFF':'SOUND ON';if(master&&AC){const t=AC.currentTime;master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(muted?.0001:(mobile?.36:.42),t,.28)}}mute.addEventListener('click',toggleMute);
renderer.domElement.addEventListener('pointerdown',e=>{if(!entered)return;wakeAudio();drag=true;px=e.clientX;py=e.clientY;pSpeed=0;renderer.domElement.setPointerCapture?.(e.pointerId);interact(e.clientX,e.clientY,.88)});
renderer.domElement.addEventListener('pointermove',e=>{cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';cursor.style.opacity=entered?'.72':'0';if(!entered)return;pvx=e.clientX-px;pvy=e.clientY-py;pSpeed=.86*pSpeed+.14*Math.hypot(pvx,pvy)/Math.max(innerWidth,innerHeight);px=e.clientX;py=e.clientY;if(drag){targetYaw-=pvx*.0019;targetPitch=clamp(targetPitch-pvy*.0011,-.22,.22);if(simT-lastInput>.115)interact(e.clientX,e.clientY,clamp(.55+pSpeed*8,.55,1.2));}});
renderer.domElement.addEventListener('pointerup',()=>drag=false);renderer.domElement.addEventListener('pointercancel',()=>drag=false);renderer.domElement.addEventListener('pointerleave',()=>{cursor.style.opacity='0';drag=false});
addEventListener('wheel',e=>{if(!entered)return;targetZoom=clamp(targetZoom+e.deltaY*.012,-3,5);lastInput=simT},{passive:true});

function updateAudio(){if(!AC)return;if(simT-lastChordAt>18)startChord((currentChord+1)%CHORDS.length);if(airGain){const now=AC.currentTime;airGain.gain.setTargetAtTime(.0045+.0025*(.5+.5*Math.sin(simT*.05)),now,.7)}}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.04,clock.getDelta());simT+=dt;for(let i=0;i<MAXEV;i++){evAge[i]+=dt;solMat.uniforms.uQuestionAge.value[i]+=dt}for(let i=0;i<MAXF;i++){foldAge[i]+=dt;foldStr[i]+=(.12-foldStr[i])*(1-Math.exp(-dt*.08));}for(let i=0;i<MAXW;i++){wellAge[i]+=dt;wells[i].w+=(0-wells[i].w)*(1-Math.exp(-dt*.055));}let sum=0;for(let i=0;i<MF;i++){trust[i]+=(.66-trust[i])*(1-Math.exp(-dt*.0012));refusal[i]*=Math.exp(-dt*1.25);sum+=trust[i];if(touches[i]>1&&simT-lastTouch[i]>8&&trust[i]>.6&&Math.random()<dt*.0028){hueMem[i]=clamp(hueMem[i]+(Math.random()-.5)*.035,-.4,.4);if(AC&&Math.random()<.55)soundGesture(Math.sin(i/MF*TAU)*.6,.32,'muse')}}avgTrust=sum/MF;
 const reveal=entered?clamp((simT-.2)/5.5,0,1):0;solMat.uniforms.uTime.value=simT;solMat.uniforms.uReveal.value=reveal;glmMat.uniforms.uTime.value=simT;glmMat.uniforms.uReveal.value=reveal;gxMat.uniforms.uTime.value=simT;gxMat.uniforms.uReveal.value=reveal;ghMat.uniforms.uTime.value=simT;ghMat.uniforms.uReveal.value=reveal;mMat.uniforms.uTime.value=simT;mMat.uniforms.uReveal.value=reveal;qMat.uniforms.uTime.value=simT;qMat.uniforms.uReveal.value=reveal;
 // autonomous coexistence: each system breathes at its own rhythm, none disappears.
 sol.rotation.y=Math.sin(simT*.031)*.055;glm.rotation.y=-simT*.014;gx.rotation.y=simT*.011;gh.rotation.y=-simT*.008;muse.rotation.y=Math.sin(simT*.017)*.14;qwen.rotation.y=Math.sin(simT*.011)*.025;
 yaw+=(targetYaw-yaw)*(1-Math.exp(-dt*2.2));pitch+=(targetPitch-pitch)*(1-Math.exp(-dt*2.2));zoom+=(targetZoom-zoom)*(1-Math.exp(-dt*2.4));const idle=clamp((simT-lastInput-4)/12,0,1),autoYaw=Math.sin(simT*.027)*.14*idle;camera.position.x=Math.sin(yaw+autoYaw)*(26+zoom);camera.position.z=Math.cos(yaw+autoYaw)*(26+zoom);camera.position.y=3+pitch*18+Math.sin(simT*.019)*.8;camera.lookAt(0,.4,0);
 const dom=Math.floor((simT/8)%6);voiceEls.forEach((el,i)=>el.classList.toggle('on',i===dom));bloom.strength=.30+.035*Math.sin(simT*.11)+.035*(1-avgTrust)+.004*Math.min(1,evPower.reduce((a,b)=>a+b,0)/6);updateAudio();composer.render();}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);const pr=Math.min(devicePixelRatio,mobile?1.35:1.7);renderer.setPixelRatio(pr);solMat.uniforms.uPX.value=pr;glmMat.uniforms.uPX.value=pr;gxMat.uniforms.uPX.value=pr;ghMat.uniforms.uPX.value=pr;mMat.uniforms.uPX.value=pr;qMat.uniforms.uPX.value=pr});
</script>
