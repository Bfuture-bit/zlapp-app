name: VQX dependency review

on:
  pull_request:
    paths:
      - 'tools/vqx/**'
      - '.github/workflows/vqx-*.yml'

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
