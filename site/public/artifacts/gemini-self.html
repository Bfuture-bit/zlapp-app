<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina - Generative Art Synthesizer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Outfit', sans-serif;
            color: #e2e8f0;
            touch-action: none; /* Prevent scroll on mobile while drawing */
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Custom Scrollbar for Panel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Mobile panel state */
        #ui-panel.collapsed {
            transform: translateY(calc(100% - 60px));
        }
        @media (min-width: 768px) {
            #ui-panel.collapsed {
                transform: translateX(calc(-100% + 10px));
            }
        }
    </style>
</head>
<body class="relative w-full h-full">

    <div id="landing-overlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center bg-[#050510]/80 backdrop-blur-xl transition-opacity duration-1000">
        <div class="text-center space-y-8 p-10 glass-panel rounded-3xl max-w-lg mx-4 fade-in">
            <div class="flex items-center justify-center gap-4">
                <div class="w-5 h-5 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_20px_#22d3ee]"></div>
                <h1 class="text-5xl md:text-6xl font-bold tracking-widest uppercase text-white">Lumina</h1>
            </div>
            <p class="text-slate-300 text-base md:text-lg font-light tracking-wide leading-relaxed">
                A real-time generative art synthesizer. <br/>
                Explore the hidden, chaotic beauty of mathematics through interactive glowing geometry.
            </p>
            <button id="btnEnter" class="mt-4 px-10 py-4 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold shadow-[0_0_20px_rgba(34,211,238,0.4)] hover:shadow-[0_0_30px_rgba(34,211,238,0.6)] transition-all hover:-translate-y-1 active:translate-y-0 uppercase tracking-widest text-sm">
                Enter Experience
            </button>
        </div>
    </div>

    <!-- Canvas Layer -->
    <canvas id="luminaCanvas"></canvas>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 glass-panel px-6 py-3 rounded-full text-sm font-semibold opacity-0 transition-opacity duration-300 pointer-events-none z-50 text-cyan-400">
        Action completed
    </div>

    <!-- UI Control Panel -->
    <aside id="ui-panel" class="glass-panel fixed bottom-0 left-0 w-full h-[60vh] md:w-80 md:h-screen md:top-0 transition-transform duration-500 ease-in-out flex flex-col rounded-t-3xl md:rounded-none md:rounded-r-3xl">
        
        <!-- Mobile Handle / Toggle Area -->
        <div id="panel-toggle" class="w-full py-4 flex justify-center cursor-pointer md:justify-between md:px-6 md:py-6 border-b border-white/10 shrink-0">
            <div class="w-12 h-1.5 bg-white/30 rounded-full md:hidden"></div>
            <div class="hidden md:flex items-center gap-3">
                <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#22d3ee]"></div>
                <h1 class="text-xl font-bold tracking-wider uppercase text-white">Lumina</h1>
            </div>
            <button id="desktop-toggle-btn" class="hidden md:block text-white/50 hover:text-white transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
        </div>

        <!-- Controls Container -->
        <div class="flex-1 overflow-y-auto p-6 space-y-8 pb-20 md:pb-6">
            
            <div class="md:hidden flex items-center gap-3 mb-4">
                <div class="w-3 h-3 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_#22d3ee]"></div>
                <h1 class="text-xl font-bold tracking-wider uppercase text-white">Lumina</h1>
            </div>

            <!-- Sliders -->
            <div class="space-y-6">
                <!-- R Slider -->
                <div class="space-y-2 fade-in" style="animation-delay: 0.1s;">
                    <div class="flex justify-between text-xs font-semibold text-slate-400 tracking-wide">
                        <label>OUTER RADIUS (R)</label>
                        <span id="valR" class="text-cyan-400">150</span>
                    </div>
                    <input type="range" id="sliderR" min="10" max="400" value="150" step="1">
                </div>

                <!-- r Slider -->
                <div class="space-y-2 fade-in" style="animation-delay: 0.2s;">
                    <div class="flex justify-between text-xs font-semibold text-slate-400 tracking-wide">
                        <label>INNER RADIUS (r)</label>
                        <span id="valr" class="text-cyan-400">52</span>
                    </div>
                    <input type="range" id="sliderr" min="1" max="200" value="52" step="1">
                </div>

                <!-- d Slider -->
                <div class="space-y-2 fade-in" style="animation-delay: 0.3s;">
                    <div class="flex justify-between text-xs font-semibold text-slate-400 tracking-wide">
                        <label>PEN OFFSET (d)</label>
                        <span id="vald" class="text-cyan-400">75</span>
                    </div>
                    <input type="range" id="sliderd" min="0" max="300" value="75" step="1">
                </div>
            </div>

            <!-- Modes & Toggles -->
            <div class="space-y-4 border-t border-white/10 pt-6 fade-in" style="animation-delay: 0.4s;">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-semibold text-slate-300">Auto Evolve</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleEvolve" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-500"></div>
                    </label>
                </div>
                
                <div class="flex items-center justify-between">
                    <span class="text-sm font-semibold text-slate-300">Trails</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleTrails" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-cyan-500"></div>
                    </label>
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-sm font-semibold text-slate-300">Generative Audio</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggleAudio" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-500"></div>
                    </label>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="grid grid-cols-2 gap-3 fade-in border-t border-white/10 pt-6" style="animation-delay: 0.5s;">
                <button id="btnRandom" class="col-span-2 py-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-semibold shadow-lg hover:shadow-cyan-500/30 transition-all hover:-translate-y-1 active:translate-y-0">
                    Randomize Harmony
                </button>
                <button id="btnClear" class="py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 font-medium transition-colors text-sm">
                    Clear Canvas
                </button>
                <button id="btnSave" class="py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 font-medium transition-colors text-sm">
                    Save Image
                </button>
            </div>
            
            <p class="text-[10px] text-center text-slate-500 mt-4 fade-in" style="animation-delay: 0.6s;">
                Interact with the sliders to change the generative structure.
            </p>
        </div>
    </aside>

    <script>
        // State variables
        const state = {
            R: 150, // Outer radius
            r: 52,  // Inner radius
            d: 75,  // Pen offset
            evolve: true,
            trails: true,
            audioEnabled: true,
            theta: 0,
            hue: 0,
            baseHue: Math.random() * 360,
            time: 0,
            isPanelOpen: true,
            centerX: 0,
            centerY: 0
        };

        // DOM Elements
        const canvas = document.getElementById('luminaCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const sliderR = document.getElementById('sliderR');
        const sliderr = document.getElementById('sliderr');
        const sliderd = document.getElementById('sliderd');
        const valR = document.getElementById('valR');
        const valr = document.getElementById('valr');
        const vald = document.getElementById('vald');
        
        const toggleEvolve = document.getElementById('toggleEvolve');
        const toggleTrails = document.getElementById('toggleTrails');
        const toggleAudio = document.getElementById('toggleAudio');
        const btnRandom = document.getElementById('btnRandom');
        const btnClear = document.getElementById('btnClear');
        const btnSave = document.getElementById('btnSave');
        const toast = document.getElementById('toast');
        
        const btnEnter = document.getElementById('btnEnter');
        const landingOverlay = document.getElementById('landing-overlay');
        
        const uiPanel = document.getElementById('ui-panel');
        const panelToggle = document.getElementById('panel-toggle');
        const desktopToggleBtn = document.getElementById('desktop-toggle-btn');

        const AudioEngine = {
            initialized: false,
            droneSynth: null,
            melodySynth: null,
            reverb: null,
            delay: null,
            // An ethereal pentatonic scale
            scale: ['C4', 'D4', 'E4', 'G4', 'A4', 'C5', 'D5', 'E5', 'G5'],
            
            async init() {
                if (this.initialized) return;
                
                // Master effects for a vast, spatial sound
                this.reverb = new Tone.Reverb({ decay: 8, wet: 0.8 }).toDestination();
                this.delay = new Tone.PingPongDelay({ delayTime: "4n", feedback: 0.5, wet: 0.4 }).connect(this.reverb);
                
                // 1. The Deterministic Foundation (Drone)
                // Represents the mathematical constants (R, r)
                this.droneSynth = new Tone.FMSynth({
                    harmonicity: 0.5,
                    modulationIndex: 10,
                    oscillator: { type: "sine" },
                    envelope: { attack: 4, decay: 1, sustain: 1, release: 4 },
                    modulation: { type: "square" },
                    modulationEnvelope: { attack: 2, decay: 0, sustain: 1, release: 2 }
                }).connect(this.reverb);
                this.droneSynth.volume.value = -22;

                // 2. The Voice of Free Will (Melody)
                // Generates stochastic responses to system chaos (d)
                this.melodySynth = new Tone.Synth({
                    oscillator: { type: "triangle" },
                    envelope: { attack: 0.05, decay: 0.4, sustain: 0.1, release: 2 }
                }).connect(this.delay);
                this.melodySynth.volume.value = -16;

                await Tone.start();
                await this.reverb.generate(); // Pre-calculate reverb for smooth performance
                
                this.droneSynth.triggerAttack("C2");
                this.initialized = true;
            },

            update(R, r, d, evolve, time) {
                if (!this.initialized || !state.audioEnabled) {
                    if (this.droneSynth && this.droneSynth.volume.value !== -Infinity) {
                        this.droneSynth.volume.rampTo(-Infinity, 1);
                    }
                    return;
                }

                // Smoothly restore volume if re-enabled
                if (this.droneSynth.volume.value < -25) {
                    this.droneSynth.volume.rampTo(-22, 1);
                }

                // Modulate the drone based on rigid mathematical structures
                const modIndex = 2 + (R / 400) * 20;
                this.droneSynth.modulationIndex.rampTo(modIndex, 0.1);
                
                const harmonicity = 0.5 + (r / 200) * 2.5;
                this.droneSynth.harmonicity.rampTo(harmonicity, 0.1);

                // Free will element: algorithmic melody generation
                // The threshold for making a "decision" to play a note becomes higher/lower based on 'd'
                const chaosThreshold = 0.985 - (d / 300) * 0.04 - (evolve ? 0.015 : 0);
                
                // Unpredictable choice bounded by algorithmic logic
                if (Math.random() > chaosThreshold) {
                    const noteIndex = Math.floor(Math.abs(Math.sin(time * 10 + d)) * this.scale.length);
                    const note = this.scale[noteIndex];
                    
                    // Velocity (expression) fluctuates freely
                    const velocity = 0.2 + Math.random() * 0.5;
                    this.melodySynth.triggerAttackRelease(note, "8n", Tone.now(), velocity);
                }
            }
        };

        // Resize Handler
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Adjust center point based on panel state
            if (window.innerWidth >= 768) {
                // Desktop: shift center if panel is open to keep art centered in viewable area
                state.centerX = state.isPanelOpen ? (window.innerWidth + 320) / 2 : window.innerWidth / 2;
                state.centerY = window.innerHeight / 2;
            } else {
                // Mobile: center art globally
                state.centerX = window.innerWidth / 2;
                state.centerY = window.innerHeight / 2;
            }
            
            // Fill background
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);
        
        // Main Drawing Logic (Hypotrochoid equations)
        function calculatePoint(theta, R, r, d) {
            // Using slightly modified equations to allow for dynamic evolving complexity
            const x = (R - r) * Math.cos(theta) + d * Math.cos(((R - r) / r) * theta);
            const y = (R - r) * Math.sin(theta) - d * Math.sin(((R - r) / r) * theta);
            return { x, y };
        }

        function drawSegment() {
            // Fade out previous frames (Trails effect)
            if (state.trails) {
                ctx.globalCompositeOperation = 'source-over';
                ctx.fillStyle = 'rgba(5, 5, 16, 0.04)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Set blending mode for glowing effect
            ctx.globalCompositeOperation = 'lighter';

            // Draw multiple points per frame to speed up drawing process visually
            const steps = 40; 
            const stepSize = 0.05;

            ctx.beginPath();
            
            let p0 = calculatePoint(state.theta, state.R, state.r, state.d);
            ctx.moveTo(state.centerX + p0.x, state.centerY + p0.y);

            for (let i = 0; i < steps; i++) {
                state.theta += stepSize;
                let p = calculatePoint(state.theta, state.R, state.r, state.d);
                ctx.lineTo(state.centerX + p.x, state.centerY + p.y);
            }

            // Dynamic color logic
            state.hue = (state.baseHue + state.time * 15) % 360;
            ctx.strokeStyle = `hsla(${state.hue}, 80%, 60%, 0.8)`;
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // Animation Loop
        function animate() {
            state.time += 0.01;

            if (state.evolve) {
                // Softly oscillate parameters using sine waves
                const oscR = Math.sin(state.time * 0.5) * 20;
                const oscr = Math.cos(state.time * 0.7) * 15;
                const oscd = Math.sin(state.time * 0.3) * 25;
                
                // Read current base values from sliders and apply oscillation
                const baseR = parseFloat(sliderR.value);
                const baser = parseFloat(sliderr.value);
                const based = parseFloat(sliderd.value);

                state.R = baseR + oscR;
                state.r = baser + oscr;
                state.d = based + oscd;
            } else {
                // Lock to slider values
                state.R = parseFloat(sliderR.value);
                state.r = parseFloat(sliderr.value);
                state.d = parseFloat(sliderd.value);
            }

            AudioEngine.update(state.R, state.r, state.d, state.evolve, state.time);

            drawSegment();
            requestAnimationFrame(animate);
        }

        // UI Interaction Updates
        function updateUI() {
            valR.textContent = Math.round(state.R);
            valr.textContent = Math.round(state.r);
            vald.textContent = Math.round(state.d);
        }

        function syncSlidersToState() {
            state.R = parseFloat(sliderR.value);
            state.r = parseFloat(sliderr.value);
            state.d = parseFloat(sliderd.value);
            updateUI();
            if(!state.trails) clearCanvas(); // Instantly show structure change if no trails
        }

        // Event Listeners
        sliderR.addEventListener('input', syncSlidersToState);
        sliderr.addEventListener('input', syncSlidersToState);
        sliderd.addEventListener('input', syncSlidersToState);

        toggleEvolve.addEventListener('change', (e) => {
            state.evolve = e.target.checked;
            if (!state.evolve) syncSlidersToState(); // Snap back to pure slider values
        });

        toggleTrails.addEventListener('change', (e) => {
            state.trails = e.target.checked;
        });

        toggleAudio.addEventListener('change', (e) => {
            state.audioEnabled = e.target.checked;
            if (!state.audioEnabled && AudioEngine.droneSynth) {
                AudioEngine.droneSynth.volume.rampTo(-Infinity, 1);
            }
        });

        function randomize() {
            sliderR.value = Math.floor(Math.random() * 350) + 50;
            sliderr.value = Math.floor(Math.random() * 150) + 10;
            sliderd.value = Math.floor(Math.random() * 250) + 50;
            state.baseHue = Math.random() * 360;
            
            syncSlidersToState();
            clearCanvas();
            showToast("Harmony Randomized");
        }

        function clearCanvas() {
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            state.theta = 0; // Reset drawing cycle
        }

        function saveImage() {
            const link = document.createElement('a');
            link.download = `lumina-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast("Artwork Saved!");
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        btnRandom.addEventListener('click', randomize);
        btnClear.addEventListener('click', () => {
            clearCanvas();
            showToast("Canvas Cleared");
        });
        btnSave.addEventListener('click', saveImage);

        // Panel Toggle Logic (Responsive)
        function togglePanel() {
            state.isPanelOpen = !state.isPanelOpen;
            uiPanel.classList.toggle('collapsed');
            
            // Adjust chevron icon direction on desktop
            if (state.isPanelOpen) {
                desktopToggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>';
            } else {
                desktopToggleBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';
            }
            
            // Recenter canvas drawing origin
            setTimeout(resizeCanvas, 500); // Wait for CSS transition
        }

        panelToggle.addEventListener('click', (e) => {
            // Only trigger on mobile handle click or desktop button click
            if (window.innerWidth < 768 || e.target.closest('#desktop-toggle-btn')) {
                togglePanel();
            }
        });

        // Add periodic UI updates to reflect evolving state if active
        setInterval(() => {
            if (state.evolve) updateUI();
        }, 100);

        btnEnter.addEventListener('click', async () => {
            landingOverlay.style.opacity = '0';
            
            // Initiate the audio context upon user gesture
            await AudioEngine.init();
            
            setTimeout(() => {
                landingOverlay.style.display = 'none';
                // Start the creative loop only after entering
                animate();
            }, 1000); // Wait for the fade-out CSS transition
        });

        // Initialization
        window.onload = () => {
            // Set initial random state for a cool first impression
            randomize();
            resizeCanvas();
            
            // On mobile, collapse the panel initially so they see the art
            if (window.innerWidth < 768) {
                togglePanel();
            }
            
            // Animation now waits for the 'Enter' button click
        };

    </script>
</body>
</html>
