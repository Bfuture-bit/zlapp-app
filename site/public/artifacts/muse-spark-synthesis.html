import * as THREE from 'three';

// ── AUDIO : airy strings & pads ──

function airyIR(ctx, sec=7.2){

// ── AEOLIA filaments (CPU) ──
const NFIL=isSmall?26:32, NSEG=isSmall?110:140, NPRIMARY=NFIL*NSEG;

const heights=16, baseRadius=3.35;
const positions=new Float32Array(NPRIMARY*3), colors=new Float32Array(NPRIMARY*3), sizes=new Float32Array(NPRIMARY);
for(let i=0;i<NFIL;i++) for(let s=0;s<NSEG;s++){ const idx=i*NSEG+s; const y=THREE.MathUtils.lerp(-heights/2,heights/2,s/(NSEG-1)); const a=baseAngles[i]; positions[idx*3]=Math.cos(a)*baseRadius; positions[idx*3+1]=y; positions[idx*3+2]=Math.sin(a)*baseRadius; colors[idx*3]=0.12; colors[idx*3+1]=0.33; colors[idx*3+2]=0.68; sizes[idx]=0.24; }

primGeom.setAttribute('position',new THREE.BufferAttribute(positions,3));

  vertexShader:`attribute vec3 color; attribute float size; varying vec3 vC; varying float vD; void main(){vC=color; vec4 mv=modelViewMatrix*vec4(position,1.); vD=-mv.z; gl_PointSize=size*(420./max(1.,-mv.z)); gl_Position=projectionMatrix*mv;}`,

const linePos=new Float32Array(NFIL*(NSEG-1)*2*3), lineCol=new Float32Array(linePos.length);

// free-will memory
const trust=new Float32Array(NFIL).fill(0.68), hueShift=new Float32Array(NFIL), detuneHist=new Float32Array(NFIL);
const lastTouchT=new Float32Array(NFIL).fill(-100); let avgTrust=0.68, refusal=new Float32Array(NPRIMARY);
let agentAng=Math.random()*TAU, agentY=0, agentVAng=0.03, agentVy=0, agentTargetAng=Math.random()*TAU, agentTargetY=0;

// dust
const dustPos=new Float32Array(DUST_COUNT*3), dustPh=new Float32Array(DUST_COUNT), dustSz=new Float32Array(DUST_COUNT), dustCols=new Float32Array(DUST_COUNT*3);
for(let i=0;i<DUST_COUNT;i++){
  const ang=Math.random()*TAU, r=5+Math.pow(Math.random(),1.4)*18;
  dustPos[i*3]=Math.cos(ang)*r; dustPos[i*3+1]=(Math.random()-.5)*24; dustPos[i*3+2]=Math.sin(ang)*r;
  dustPh[i]=Math.random()*TAU; dustSz[i]=0.05+Math.random()*0.08; dustCols[i*3]=0.16+Math.random()*0.1; dustCols[i*3+1]=0.32+Math.random()*0.15; dustCols[i*3+2]=0.58+Math.random()*0.3;
}
const dustGeom=new THREE.BufferGeometry();
dustGeom.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
dustGeom.setAttribute('aPhase',new THREE.BufferAttribute(dustPh,1));
dustGeom.setAttribute('size',new THREE.BufferAttribute(dustSz,1));
dustGeom.setAttribute('color',new THREE.BufferAttribute(dustCols,3));
const dustMat=new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0}},
  vertexShader:`attribute float aPhase; attribute float size; attribute vec3 color; varying vec3 vC; uniform float uTime; void main(){vC=color; vec3 p=position; p.x+=sin(uTime*.06+aPhase)*.45; p.y+=sin(uTime*.05+aPhase*1.2)*.32; vec4 mv=modelViewMatrix*vec4(p,1.); gl_PointSize=size*(340./max(1.5,-mv.z)); gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vC; void main(){vec2 c=gl_PointCoord-.5; float d=dot(c,c)*4.; if(d>1.) discard; float a=exp(-d*1.9)*.52; gl_FragColor=vec4(vC*(.7+a), a);}`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, vertexColors:true

const haloPos=new Float32Array(HALO_COUNT*3), haloSz=new Float32Array(HALO_COUNT), haloCols=new Float32Array(HALO_COUNT*3);
for(let i=0;i<HALO_COUNT;i++){ const u=Math.random(), v=Math.random(); const th=TAU*u, ph=Math.acos(2*v-1); const r=13+Math.random()*15; haloPos[i*3]=r*Math.sin(ph)*Math.cos(th); haloPos[i*3+1]=r*Math.sin(ph)*Math.sin(th)*.6; haloPos[i*3+2]=r*Math.cos(ph); haloSz[i]=0.8+Math.random()*1.1; haloCols[i*3]=0.15; haloCols[i*3+1]=0.22; haloCols[i*3+2]=0.44; }

// ── SOL FIELD (GPU) — the living question ──

const LAW=`

void questionLaw(inout vec3 p,float u,float lane,float t,out float qOut,out float rOut,out float mOut){

  }
  primGeom.attributes.position.needsUpdate=true; primGeom.attributes.color.needsUpdate=true; primGeom.attributes.size.needsUpdate=true;
  let li=0; for(let fi=0;fi<NFIL;fi++) for(let s=0;s<NSEG-1;s++){ const i0=fi*NSEG+s,i1=fi*NSEG+s+1; linePos[li*3]=positions[i0*3]; linePos[li*3+1]=positions[i0*3+1]; linePos[li*3+2]=positions[i0*3+2]; const cr=(colors[i0*3]+colors[i1*3])*0.5, cg=(colors[i0*3+1]+colors[i1*3+1])*0.5, cb=(colors[i0*3+2]+colors[i1*3+2])*0.5; lineCol[li*3]=cr*0.36; lineCol[li*3+1]=cg*0.36; lineCol[li*3+2]=cb*0.36; li++; linePos[li*3]=positions[i1*3]; linePos[li*3+1]=positions[i1*3+1]; linePos[li*3+2]=positions[i1*3+2]; lineCol[li*3]=cr*0.36; lineCol[li*3+1]=cg*0.36; lineCol[li*3+2]=cb*0.36; li++; }
  lineGeom.attributes.position.needsUpdate=true; lineGeom.attributes.color.needsUpdate=true;
  lineMat.opacity=0.15*(0.5+avgTrust*.6);

  // field uniforms
  fieldUniforms.uTime.value=time; fieldUniforms.uReveal.value= entered? 1:0.22;
  dustMat.uniforms.uTime.value=time; haloMat.uniforms.uT.value=time*0.42;
  ribMat.uniforms.uTime.value=time; ribMat.uniforms.uLife.value=life;
  group.rotation.y+=dt*0.018; group.rotation.x=Math.sin(time*0.03)*0.08;

  // camera — slow living orbit, leans to touch
  const camR=16.5 + Math.sin(time*0.041)*1.8, ang=time*0.045, yT=Math.sin(time*0.034)*1.6;
  camTarPos.set(Math.cos(ang)*camR, yT, Math.sin(ang)*camR);
  if(pointer.active&&pointer.down){ camTarPos.x+=pointer.x*1.2; camTarPos.z+= -pointer.y*1.0; camLookT.set(pointer.x*0.6, -pointer.y*0.6,0); } else { camLookT.set(Math.sin(time*0.046)*0.3, Math.sin(time*0.06)*0.4,0); }
  camPos.lerp(camTarPos, 1-Math.exp(-0.5*dt*6)); camLook.lerp(camLookT, 1-Math.exp(-0.6*dt*6));
  camera.position.copy(camPos); camera.lookAt(camLook);

  bloom.strength=0.42+life*0.12 + (heat.reduce((a,b)=>a+b,0)/NPRIMARY)*0.6;
  if(actx && entered){
    const totQ=eventPower.reduce((a,b)=>a+b,0);
    lp: padVoices.forEach(v=>{ /* gentle filter breathe */ });
    if(noiseGain) noiseGain.gain.setTargetAtTime(0.004+ breathe*0.006 + totQ*0.004, actx.currentTime, 0.6);
  }
  composer.render();
}
animate();

// spontaneous — both layers
setInterval(()=>{ if(!entered) return; if(Math.random()<0.45){ const fi=Math.floor(Math.random()*NFIL), mid=Math.floor(NSEG*0.5); const id=fi*NSEG+mid; vr[id]+=(Math.random()-.5)*1.2; heat[id]=0.6; if(actx) swell((Math.random()-.5)*1.2,0,0.35); } }, 2200);
setInterval(()=>{ if(!entered) return; if(Math.random()<0.6){ const u=(Math.random()*2-1)*0.8, v=(Math.random()-.5)*0.4; const i=eventCursor%MAX_EVENTS; eventCursor++; eventU[i]=u; eventV[i]=v; eventT[i]=time; eventPower[i]=0.18+Math.random()*0.16; swell(u,v,0.42); } }, 3400);

window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });

btn.addEventListener('click', async()=>{
  if(actx&&actx.state==='suspended') await actx.resume();
  if(!actx) initAudio();
  entered=true; overlay.style.opacity='0'; overlay.style.pointerEvents='none';
  toast.style.color='rgba(200,214,245,.42)'; setTimeout(()=>toast.style.color='rgba(200,214,245,0)', 3800);
});
</script>
